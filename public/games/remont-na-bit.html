<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ремонт на Бит</title>
<link rel="canonical" href="https://software.kunev.dev/igri/remont-na-bit">
<script>
/* Тема: следва превключвателя на software.kunev.dev (общ ключ „theme“ в localStorage),
   включително когато играта е вградена в iframe; по подразбиране — светъл режим. */
(function () {
  function apply() {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  }
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'theme' || e.key === null) apply(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: работилница на робот — горна лента със статус на екипа, карта с робота и модулите, екран за ремонт на модул */
:root{
  --bg:#eaeef3; --panel:#ffffff; --ink:#1b2632; --muted:#5a6878; --line:#d3dae3;
  --accent:#2457c5; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --paper:#fcfdfe;
  --terminal:#d3ecd8; --terminal-s:#3b7a4b;
  --io:#d2e5f8; --io-s:#386ca3;
  --process:#fdf2c2; --process-s:#93781a;
  --bad:#cf3a2c; --bad-soft:#fbe5e2; --warn:#b97d00; --warn-soft:#fdf1d6; --good:#2c8447; --good-soft:#e0f2e5;
  --robot:#c9d3df; --robot-s:#4b5d70; --eye:#2457c5;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4eaf1; --muted:#9aa8b8; --line:#2d3743;
  --accent:#7aa2ff; --accent-ink:#0d1420; --accent-soft:#22304a; --paper:#161c23;
  --terminal:#1f3a28; --terminal-s:#73c08a; --io:#1d3147; --io-s:#79aee6; --process:#3a3418; --process-s:#d8bc55;
  --bad:#ff7b6b; --bad-soft:#3d211e; --warn:#f0bd4f; --warn-soft:#3a3020; --good:#6fcf8d; --good-soft:#1c3324;
  --robot:#3a4654; --robot-s:#9fb0c3; --eye:#7aa2ff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4eaf1; --muted:#9aa8b8; --line:#2d3743;
  --accent:#7aa2ff; --accent-ink:#0d1420; --accent-soft:#22304a; --paper:#161c23;
  --terminal:#1f3a28; --terminal-s:#73c08a; --io:#1d3147; --io-s:#79aee6; --process:#3a3418; --process-s:#d8bc55;
  --bad:#ff7b6b; --bad-soft:#3d211e; --warn:#f0bd4f; --warn-soft:#3a3020; --good:#6fcf8d; --good-soft:#1c3324;
  --robot:#3a4654; --robot-s:#9fb0c3; --eye:#7aa2ff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.brand{margin-right:auto;display:flex;flex-direction:column}
.brand b{font-family:var(--font-display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.82rem}
.stat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem}
.stat .v{font-variant-numeric:tabular-nums;font-size:1.05rem}
.jokers{display:inline-flex;gap:4px}
.jokers i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.jokers i.used{background:var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:11px 22px;font-size:1rem}
.btn.danger{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* start */
.start{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;padding:28px}
.start h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 10px;line-height:1.1}
.start p{max-width:62ch;margin:0 0 10px}
.how{margin:14px 0;padding-left:20px}
.how li+li{margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;max-width:360px;margin-top:16px}
.field label{font-weight:600;font-size:.9rem}
.field input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}

/* robot */
.robot svg{width:100%;height:auto;display:block;max-width:300px;margin:0 auto}
.r-body{fill:var(--robot);stroke:var(--robot-s);stroke-width:3}
.r-eye{fill:var(--eye)}
.r-line{stroke:var(--robot-s);stroke-width:3;fill:none}
.led{stroke:var(--robot-s);stroke-width:2}
.led.off{fill:var(--bad);animation:blink 1.3s steps(2) infinite}
.led.on{fill:var(--good)}
.led-t{font-family:var(--font-body);font-size:11px;fill:var(--ink);font-weight:600}
@keyframes blink{50%{opacity:.35}}

/* map */
.map{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.map-left{padding:18px;display:flex;flex-direction:column;gap:12px}
.progress{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .5s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .no{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile h3{margin:0;font-size:1.08rem}
.tile p{margin:0;font-size:.88rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.broken{background:var(--bad-soft);color:var(--bad)}
.pill.fixing{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.locked{background:var(--bg);color:var(--muted)}
.tile.special{border-style:dashed}
.tile .pts{margin-top:auto;font-size:.82rem;font-weight:600;color:var(--muted)}

/* module screen */
.mod{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.mod-main{padding:20px;min-width:0}
.mod-head .no{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mod-head h2{font-family:var(--font-display);font-weight:500;font-size:1.45rem;margin:4px 0 6px}
.story{margin:0 0 6px;color:var(--muted)}
.task{margin:0;font-weight:600}
.stages{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.stages span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--muted)}
.stages span.cur{background:var(--accent);color:var(--accent-ink)}
.stages span.ok{background:var(--good-soft);color:var(--good)}
.side{display:flex;flex-direction:column;gap:12px}
.side .card{padding:14px}
.side h4{margin:0 0 6px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.side p{margin:0;font-size:.92rem}
.side p + p{margin-top:6px}
.bit-says{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
.bit-face{width:44px;height:44px}

/* order stage */
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.zone{border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--paper);min-height:120px}
.zone h4{margin:0 0 8px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pool{display:flex;flex-direction:column;gap:8px}
.chain{display:flex;flex-direction:column;align-items:center;gap:0}
.blk{border:2px solid;padding:9px 16px;font-weight:600;font-size:.95rem;min-width:200px;text-align:center;background:var(--panel);position:relative}
.blk.in,.blk.out{background:var(--io);border-color:var(--io-s);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);border:none;padding:11px 28px}
.blk.calc{background:var(--process);border-color:var(--process-s);border-radius:3px}
.blk.term{background:var(--terminal);border-color:var(--terminal-s);border-radius:99px;min-width:130px}
button.blk:hover{filter:brightness(.96)}
.blk.bad{outline:3px dashed var(--bad);outline-offset:3px}
.blk.in.bad,.blk.out.bad{background:var(--bad-soft)}
.arrow{width:2px;height:18px;background:var(--ink);position:relative;margin:0 auto}
.arrow::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.citem{display:flex;align-items:center;gap:6px}
.citem .ctl{display:flex;flex-direction:column;gap:2px}
.citem .ctl button{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:28px;height:22px;font-size:.7rem;line-height:1;padding:0}
.slot-hint{color:var(--muted);font-size:.86rem;padding:10px;text-align:center}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-weight:600}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.info{background:var(--accent-soft);color:var(--ink);font-weight:500}

/* trace stage */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.trace{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
.trace th,.trace td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center}
.trace th{background:var(--bg);font-size:.86rem}
.trace th:first-child,.trace td:first-child{text-align:left;font-weight:600}
.trace td.carry{color:var(--muted)}
.trace td.given{font-weight:700;color:var(--accent)}
.trace input{width:86px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:center;background:var(--paper);font-weight:600}
.trace input.bad{border-color:var(--bad);background:var(--bad-soft)}
.trace input.ok{border-color:var(--good);background:var(--good-soft)}
.trace .outrow td{background:var(--paper)}

/* done */
.done-box{text-align:center;padding:10px 0}
.done-box h3{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin:6px 0;color:var(--good)}
.outs{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.outs span{background:var(--io);border-radius:6px;padding:6px 14px;font-weight:700}

/* swap */
.cups{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px}
.cup{display:flex;flex-direction:column;align-items:center;gap:6px}
.cup .glass{width:96px;height:110px;border:3px solid var(--robot-s);border-top:none;border-radius:0 0 22px 22px;display:grid;place-items:center;font-family:var(--font-display);font-size:2rem;font-weight:700;background:var(--paper);transition:background .3s}
.cup .glass.full{background:var(--io)}
.cup .glass.flash{animation:pulse .6s}
@keyframes pulse{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.cup b{font-size:1.1rem}
.cmds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.cmds button{border:2px solid var(--process-s);background:var(--process);border-radius:4px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{margin:12px auto 0;max-width:260px;display:flex;flex-direction:column;align-items:center}

/* break */
.brk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.brk .inputs{display:flex;gap:12px;flex-wrap:wrap}
.brk .inputs .field{margin-top:0;max-width:150px}
.receipt{border:1px dashed var(--line);border-radius:10px;padding:14px;background:var(--paper);font-variant-numeric:tabular-nums}
.receipt div{display:flex;justify-content:space-between;padding:3px 0}
.receipt .tot{font-weight:700;font-size:1.15rem;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.receipt .neg{color:var(--bad)}

/* report */
.report{padding:24px;text-align:center}
.report h2{font-family:var(--font-display);font-weight:700;font-size:1.8rem;margin:4px 0}
.score{font-family:var(--font-display);font-weight:700;font-size:3.4rem;color:var(--accent);line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px;background:var(--paper)}
.badge b{display:block}
.badge span{font-size:.82rem;color:var(--muted)}
.badge.got{border-color:var(--good);background:var(--good-soft)}
.badge.no{opacity:.5}
.rep-table{margin:10px auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rep-table td{padding:5px 14px;border-bottom:1px solid var(--line);text-align:left}
.rep-table td:last-child{text-align:right;font-weight:700}

/* handbook */
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);display:grid;place-items:center;z-index:40;padding:16px}
.dialog{background:var(--panel);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.dialog h2{font-family:var(--font-display);font-weight:500;margin:0 0 10px;font-size:1.3rem}
.kcard{border-top:1px solid var(--line);padding:12px 0}
.kcard h3{margin:0 0 4px;font-size:1.02rem}
.kcard p{margin:0}
code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.92em;background:var(--bg);padding:1px 5px;border-radius:4px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:900px){
  .start,.map,.mod,.order,.brk{grid-template-columns:minmax(0,1fr)}
  .robot svg{max-width:220px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar" id="bar" hidden>
    <div class="brand"><b>Ремонт на Бит</b><small id="teamLbl"></small></div>
    <span class="stat" title="Точки на екипа">★ <span class="v" id="scoreV">0</span> т.</span>
    <span class="stat" title="Жокери (подсказка = −1 точка)">Жокери <span class="jokers" id="jokersV"></span></span>
    <button class="btn" type="button" id="hbBtn">Наръчник на Бит</button>
    <button class="btn" type="button" id="mapBtn">Карта</button>
  </header>
  <main id="view"></main>
</div>
<div class="overlay" id="hb" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="hbTitle">
    <h2 id="hbTitle">Наръчник на Бит</h2>
    <div id="hbBody"></div>
    <div class="row"><button class="btn primary" type="button" id="hbClose">Затвори</button></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => { if (n === null || n === undefined || Number.isNaN(n)) return ''; const r = Math.round(n * 100) / 100; return String(r).replace('.', ','); };
const parse = s => { s = String(s || '').trim().replace(/\s/g, '').replace(',', '.'); if (s === '' || s === '-') return NaN; return Number(s); };
const close = (a, b) => Math.abs(a - b) < 0.011;

/* ---------- knowledge cards ---------- */
const CARDS = {
  lin: { t: 'Линеен алгоритъм', b: 'Действията се изпълняват едно след друго, всяко точно по веднъж – без условия (ромбове) и без повторения. Схемата е права „верига“ отгоре надолу: Начало → вход → действия → изход → Край.' },
  assign: { t: 'Присвояване', b: '<span class="mono">S = a * b</span> (в псевдокод <span class="mono">S ← a * b</span>) значи: пресметни дясната страна и запиши резултата в променливата отляво. Старата стойност на S се губи.' },
  trace: { t: 'Проследяване (трасиране)', b: 'Проверяваме алгоритъма „на ръка“ с таблица: всеки ред е стъпка, всяка колона е променлива. Ако резултатът е грешен, грешката е в алгоритъма!' },
  errors: { t: 'Чести грешки', b: '1) Изчисление преди въвеждане. 2) Забравен изход – алгоритъмът смята, но не показва резултата. 3) Скоби: <span class="mono">(a + b + c) / 3</span>, а не <span class="mono">a + b + c / 3</span> – делението се изпълнява преди събирането.' },
  divmod: { t: 'div и mod', b: '<span class="mono">div</span> е целочислено деление, <span class="mono">mod</span> е остатъкът – както при алгоритъма на Евклид. Пример: <span class="mono">100 div 60 = 1</span>, <span class="mono">100 mod 60 = 40</span>.' },
  swap: { t: 'Размяна на две стойности', b: 'Нужна е трета, празна „чаша“: <span class="mono">c = a; a = b; b = c</span>. Ако напишем само <span class="mono">a = b</span> и после <span class="mono">b = a</span>, губим старата стойност на a.', locked: true }
};

/* ---------- modules ---------- */
const MODS = [
  { id: 'diag', no: 'Модул 0 · Обучение', name: 'Скенер за размери', led: 'СКЕНЕР',
    story: 'Бит не може да измерва предмети. Започнете със скенера – той пресмята лице и периметър на правоъгълник.',
    task: 'Пресметнете лицето S и периметъра P на правоъгълник със страни a и b.',
    given: { a: 5, b: 3 }, vars: ['a', 'b', 'S', 'P'], cards: ['lin', 'assign'],
    steps: [
      { k: 'in', text: 'въведи a, b', defs: ['a', 'b'], uses: [] },
      { k: 'calc', text: 'S = a * b', defs: ['S'], uses: ['a', 'b'], f: v => v.a * v.b },
      { k: 'calc', text: 'P = 2 * (a + b)', defs: ['P'], uses: ['a', 'b'], f: v => 2 * (v.a + v.b) },
      { k: 'out', text: 'изведи S, P', defs: [], uses: ['S', 'P'] }
    ],
    traps: [],
    hintOrder: 'Първо Бит трябва да ПОЛУЧИ данните (вход), после да СМЯТА и чак накрая да ПОКАЖЕ резултата (изход).' },
  { id: 'grades', no: 'Модул 1', name: 'Калкулатор за оценки', led: 'ОЦЕНКИ',
    story: 'Бит пресмята средния успех от три оценки, но дава странни числа. Нещо в схемата е объркано.',
    task: 'Пресметнете средно аритметично ср на три оценки a, b и c.',
    given: { a: 5, b: 6, c: 4 }, vars: ['a', 'b', 'c', 'ср'], cards: ['errors'],
    steps: [
      { k: 'in', text: 'въведи a, b, c', defs: ['a', 'b', 'c'], uses: [] },
      { k: 'calc', text: 'ср = (a + b + c) / 3', defs: ['ср'], uses: ['a', 'b', 'c'], f: v => (v.a + v.b + v.c) / 3 },
      { k: 'out', text: 'изведи ср', defs: [], uses: ['ср'] }
    ],

    steps: [

const MAIN = ['diag', 'grades', 'temp', 'clock', 'shop'];
const modById = id => MODS.find(m => m.id === id);
function blocksOf(m) {
  const all = [...m.steps.map((s, i) => ({ ...s, id: 's' + i })), ...m.traps.map((t, i) => ({ ...t, id: 't' + i, trap: true }))];
  // deterministic shuffle
  const h = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return all.sort((x, y) => h(x.text + m.id) - h(y.text + m.id));
}

/* ---------- state ---------- */
const KEY = 'remont-na-bit-v1';
let S = null;
function fresh(team) {
  return { team, view: 'map', mods: {}, swap: { done: false, fails: 0, pts: 0, mem: { a: 7, b: 2, c: null }, log: [], lost: null },
    brk: { done: false, pts: 0, price: '1,5', count: '6' }, hintsLeft: 2, hintsUsed: 0, hints: {}, started: Date.now() };
}
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (_) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
function mstate(id) {
  if (!S.mods[id]) S.mods[id] = { stage: 'order', chain: [], orderFails: 0, traceFails: 0, trapHit: false, ptsOrder: 0, ptsTrace: 0, trace: {}, msg: null };
  return S.mods[id];
}
const isDone = id => id === 'swap' ? S.swap.done : id === 'brk' ? S.brk.done : !!(S.mods[id] && S.mods[id].stage === 'done');
const repairedMain = () => [...MAIN, 'swap'].filter(isDone).length;
const breakUnlocked = () => repairedMain() >= 4;
function score() {
  let p = 0;
  Object.values(S.mods).forEach(m => { p += (m.ptsOrder || 0) + (m.ptsTrace || 0); });
  p += S.swap.pts + S.brk.pts;
  return Math.max(0, p - S.hintsUsed);
}

function stagesHtml(ms) {

  return `<div class="stages"><span class="${a}">1. Подреди схемата</span><span class="${b}">2. Проследи с таблица</span><span class="${c}">3. Модулът работи</span></div>`;
}
function sideHtml(m, ms) {

    hintBox = `<div class="card"><h4>Жокер</h4>${hint ? `<p>${esc(hint)}</p>` : `<p>Подсказка за този етап. Струва 1 точка.</p><div class="row" style="margin-top:8px"><button class="btn" type="button" data-act="hint" ${S.hintsLeft ? '' : 'disabled'}>Използвай жокер (−1 т.)</button></div>${S.hintsLeft ? '' : '<p style="margin-top:6px;color:var(--muted)">Нямате повече жокери.</p>'}`}</div>`;
  }
  return `<aside class="side">${hintBox}${cards}</aside>`;
}
function givenText(m) { return Object.entries(m.given).map(([k, v]) => `${k} = ${fmt(v)}`).join(', '); }

function blkHtml(b, extra = '', tag = 'div', attrs = '') {
  const cls = b.k === 'calc' ? 'calc' : b.k;
  return `<${tag} class="blk ${cls} ${extra}" ${attrs}>${esc(b.text)}</${tag}>`;
}
function renderMod(id) {
  const m = modById(id); if (!m) return go('map');
  const ms = mstate(id);
  const blocks = blocksOf(m);
  const byId = Object.fromEntries(blocks.map(b => [b.id, b]));
  let body = '';
  if (ms.stage === 'order') {
    const pool = blocks.filter(b => !ms.chain.includes(b.id));
    const bad = new Set(ms.badIds || []);
    const chainHtml = ms.chain.length ? ms.chain.map((bid, i) => `<div class="arrow"></div><div class="citem">${blkHtml(byId[bid], bad.has(bid) ? 'bad' : '', 'button', `type="button" data-remove="${bid}" title="Върни обратно"`)}<div class="ctl"><button type="button" data-up="${i}" aria-label="Нагоре" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-down="${i}" aria-label="Надолу" ${i === ms.chain.length - 1 ? 'disabled' : ''}>▼</button></div></div>`).join('')
      : `<div class="arrow"></div><div class="slot-hint">Натиснете блок отляво, за да го добавите тук.</div>`;
    body = `<p class="msg info">${m.id === 'diag' ? 'Обучение: натиснете блоковете в реда, в който Бит трябва да ги изпълни. Натиснете блок в схемата, за да го върнете. ' : ''}Внимание: някои модули имат <b>капан</b> – блок, който не трябва да влиза в схемата.</p>
      <div class="order" style="margin-top:14px">
        <div class="zone"><h4>Части</h4><div class="pool">${pool.map(b => blkHtml(b, '', 'button', `type="button" data-add="${b.id}"`)).join('') || '<p class="slot-hint">Всички части са в схемата.</p>'}</div></div>
        <div class="zone"><h4>Схемата на Бит</h4><div class="chain"><div class="blk term">Начало</div>${chainHtml}<div class="arrow"></div><div class="blk term">Край</div></div></div>
      </div>
      ${ms.msg ? `<div class="msg ${ms.msg.kind}">${esc(ms.msg.text)}</div>` : ''}
      <div class="row"><button class="btn primary big" type="button" data-act="checkOrder" ${ms.chain.length ? '' : 'disabled'}>Провери схемата</button><span style="color:var(--muted);font-size:.9rem">Грешни проверки: ${ms.orderFails}</span></div>`;
  } else if (ms.stage === 'trace') {
    const chain = ms.chain.map(b => byId[b]);
    const rows = [];
    const carry = {};
    chain.forEach((b, ri) => {
      if (b.k === 'out') {
        rows.push(`<tr class="outrow"><td>${esc(b.text)}</td><td colspan="${m.vars.length}" style="color:var(--muted)">Бит показва резултата</td></tr>`);
        return;
      }
      const cells = m.vars.map(v => {
        if (b.defs.includes(v)) {
          if (b.k === 'in') { carry[v] = fmt(m.given[v]); return `<td class="given">${fmt(m.given[v])}</td>`; }
          const key = ri + ':' + v;
          const val = ms.trace[key] ?? '';
          const st = ms.traceMarks && ms.traceMarks[key];
          carry[v] = val;
          return `<td><input type="text" inputmode="decimal" id="tr-${id}-${ri}-${v}" data-tr="${key}" value="${esc(val)}" class="${st || ''}" aria-label="${esc(v)} след „${esc(b.text)}“"></td>`;
        }
        return `<td class="carry">${carry[v] !== undefined ? esc(carry[v]) : ''}</td>`;
      }).join('');
      rows.push(`<tr><td>${esc(b.text)}</td>${cells}</tr>`);
    });
    body = `<p class="msg info">Проследете схемата с дадените стойности: <b>${esc(givenText(m))}</b>. Попълнете стойността, която всеки блок записва. Сивите числа са стойностите, които променливата вече пази.</p>
      <div class="tscroll" style="margin-top:14px"><table class="trace"><thead><tr><th>Стъпка</th>${m.vars.map(v => `<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
      ${ms.msg ? `<div class="msg ${ms.msg.kind}">${esc(ms.msg.text)}</div>` : ''}
      <div class="row"><button class="btn primary big" type="button" data-act="checkTrace">Рестартирай модула</button><span style="color:var(--muted);font-size:.9rem">Грешни опити: ${ms.traceFails}</span></div>`;
  } else {
    const vals = compute(m, ms.chain.map(b => byId[b]));
    const outB = m.steps.find(s => s.k === 'out');
    body = `<div class="done-box">${bitFace()}
      <h3>Модулът работи!</h3>
      <p>Бит извежда:</p>
      <div class="outs">${outB.uses.map(v => `<span>${esc(v)} = ${fmt(vals[v])}</span>`).join('')}</div>
      <p>Подредена схема: +${ms.ptsOrder} т. · Проследяване: +${ms.ptsTrace} т.</p>
      <div class="row" style="justify-content:center"><button class="btn primary big" type="button" data-go="map">Към картата</button></div></div>`;
  }
  view.innerHTML = `<section class="mod">
    <div class="card mod-main">
      <div class="mod-head"><span class="no">${esc(m.no)}${m.bonus ? ' · по желание' : ''}</span><h2>${esc(m.name)}</h2><p class="story">${esc(m.story)}</p><p class="task">${esc(m.task)}</p></div>
      ${stagesHtml(ms)}
      ${body}
    </div>
    ${sideHtml(m, ms)}
  </section>`;
}

function compute(m, chain) {
  const v = { ...m.given };
  chain.forEach(b => { if (b.k === 'calc' && b.f) v[b.defs[0]] = b.f(v); });
  return v;
}

function checkOrder(m, ms) {
  const blocks = blocksOf(m), byId = Object.fromEntries(blocks.map(b => [b.id, b]));
  const chain = ms.chain.map(i => byId[i]);
  ms.badIds = [];
  const fail = (text, ids = []) => { ms.orderFails++; ms.badIds = ids; ms.msg = { kind: 'bad', text }; };
  const trap = chain.find(b => b.trap);
  if (trap) { ms.trapHit = true; return fail(trap.msg, [trap.id]); }
  const defined = new Set();
  for (const b of chain) {
    for (const u of b.uses) if (!defined.has(u)) {
      if (b.k === 'out') return fail(`Изходът „${b.text}“ е твърде рано: ${u} още няма стойност.`, [b.id]);
      const inDef = m.steps.find(s => s.k === 'in' && s.defs.includes(u));
      if (inDef) return fail(`Изчисление преди въвеждане! „${b.text}“ използва ${u}, но стойността на ${u} още не е въведена.`, [b.id]);
      return fail(`„${b.text}“ използва ${u}, но стойността на ${u} още не е пресметната. Сменете реда.`, [b.id]);
    }
    b.defs.forEach(d => defined.add(d));
  }
  const missing = m.steps.filter(s => !chain.some(c => c.text === s.text));
  if (missing.length) {
    if (missing.some(s => s.k === 'out')) return fail('Забравен изход! Бит смята, но не показва резултата.');
    if (missing.some(s => s.k === 'in')) return fail('Липсва вход – откъде Бит ще вземе данните?');
    return fail(`Схемата не е пълна: липсва${missing.length > 1 ? 'т' : ''} ${missing.length} блок${missing.length > 1 ? 'а' : ''}.`);
  }
  if (chain[chain.length - 1].k !== 'out') return fail('Изходът трябва да е последната стъпка преди „Край“.');
  ms.ptsOrder = Math.max(1, 3 - ms.orderFails);
  ms.stage = 'trace'; ms.msg = { kind: 'good', text: `Схемата е правилна! +${ms.ptsOrder} т. Сега я проследете.` };
}

function checkTrace(m, ms) {
  const blocks = blocksOf(m), byId = Object.fromEntries(blocks.map(b => [b.id, b]));
  const chain = ms.chain.map(i => byId[i]);
  const v = { ...m.given };
  ms.traceMarks = {};
  let bad = 0, empty = 0;
  chain.forEach((b, ri) => {
    if (b.k !== 'calc') return;
    const d = b.defs[0];
    const correct = b.f(v);
    v[d] = correct;
    const key = ri + ':' + d;
    const got = parse(ms.trace[key]);
    if (Number.isNaN(got)) { empty++; ms.traceMarks[key] = 'bad'; }
    else if (!close(got, correct)) { bad++; ms.traceMarks[key] = 'bad'; }
    else ms.traceMarks[key] = 'ok';
  });
  if (empty && !bad) { ms.msg = { kind: 'bad', text: 'Попълнете всички празни клетки.' }; return; }
  if (bad || empty) { ms.traceFails++; ms.msg = { kind: 'bad', text: `Бит не се рестартира: ${bad + empty} ${bad + empty === 1 ? 'стойност е грешна' : 'стойности са грешни'}. Пресметнете отново червените клетки.` }; return; }
  ms.ptsTrace = Math.max(1, 3 - ms.traceFails);
  ms.traceFirst = ms.traceFails === 0;
  ms.stage = 'done'; ms.msg = null;
  toast(`${m.name}: модулът е поправен!`);
}

function traceHint(m, ms) {
  const blocks = blocksOf(m), byId = Object.fromEntries(blocks.map(b => [b.id, b]));
  const chain = ms.chain.map(i => byId[i]);
  const v = { ...m.given };
  for (let ri = 0; ri < chain.length; ri++) {
    const b = chain[ri]; if (b.k !== 'calc') continue;
    const d = b.defs[0];
    const correct = b.f(v);
    const got = parse(ms.trace[ri + ':' + d]);
    if (Number.isNaN(got) || !close(got, correct)) {
      const rhs = b.text.split('=').slice(1).join('=');
      const sub = rhs.replace(/[A-Za-zА-Яа-я]+/g, w => (w in v) ? fmt(v[w]) : w);
      return `Заместете числата в „${b.text}“: ${d} =${sub}. Пресметнете внимателно${/div|mod/.test(b.text) ? ' (div – цялата част, mod – остатъкът)' : ''}.`;
    }
    v[d] = correct;
  }
  return 'Всички стойности изглеждат верни – натиснете „Рестартирай модула“.';
}

/* ---------- swap ---------- */
const CMDS = [['c', 'a'], ['c', 'b'], ['a', 'b'], ['a', 'c'], ['b', 'a'], ['b', 'c']];
function renderSwap() {
  const sw = S.swap;
  const glass = n => `<div class="cup"><div class="glass ${sw.mem[n] !== null ? 'full' : ''}" id="g-${n}">${sw.mem[n] === null ? '' : sw.mem[n]}</div><b>${n}</b></div>`;
  const prog = sw.log.length ? sw.log.map(t => `<div class="arrow"></div><div class="blk calc">${esc(t)}</div>`).join('') : '<div class="arrow"></div><div class="slot-hint">Натиснете команда отдолу.</div>';
  let body;
  if (sw.done) {
    body = `<div class="done-box">${bitFace()}<h3>Паметта е поправена!</h3><p>a = 2, b = 7 – стойностите са разменени, без да се изгуби нищо. +${sw.pts} т.</p>
      <p><b>Правилото:</b> <span class="mono">c = a; a = b; b = c</span> – трета „празна чаша“.</p>
      <div class="row" style="justify-content:center"><button class="btn primary big" type="button" data-go="map">Към картата</button></div></div>`;
  } else {
    body = `<p class="msg info">Паметта на Бит е разменила две числа: сега <b>a = 7</b> и <b>b = 2</b>, а трябва <b>a = 2</b> и <b>b = 7</b>. Всяка команда е присвояване: пресметни дясната страна и я запиши отляво. Старата стойност отляво се губи!</p>
      <div class="cups">${glass('a')}${glass('b')}${glass('c')}</div>
      ${sw.lost ? `<div class="msg bad">${esc(sw.lost)}</div><div class="row" style="justify-content:center"><button class="btn primary" type="button" data-act="swapReset">Започни отначало</button></div>`
        : `<div class="cmds">${CMDS.map(([l, r]) => `<button type="button" data-cmd="${l}${r}">${l} = ${r}</button>`).join('')}</div>`}
      <div class="prog"><div class="blk term">Начало</div>${prog}</div>
      <div class="row" style="justify-content:center"><span style="color:var(--muted);font-size:.9rem">Неуспешни опити: ${sw.fails}</span>${sw.log.length && !sw.lost ? '<button class="btn" type="button" data-act="swapReset">Изчисти и започни отначало</button>' : ''}</div>`;
  }
  const hk = 'swap';
  const hint = S.hints[hk];
  view.innerHTML = `<section class="mod">
    <div class="card mod-main"><div class="mod-head"><span class="no">Модул 5</span><h2>Памет</h2>
      <p class="story">Като две чаши – с ябълков сок в чаша a и портокалов в чаша b. Как да ги разменим? Имате и трета, празна чаша c.</p>
      <p class="task">Разменете стойностите на a и b с възможно най-малко команди.</p></div>${body}</div>
    <aside class="side">
      ${sw.done ? '' : `<div class="card"><h4>Жокер</h4>${hint ? `<p>${esc(hint)}</p>` : `<p>Подсказка. Струва 1 точка.</p><div class="row" style="margin-top:8px"><button class="btn" type="button" data-act="hint" ${S.hintsLeft ? '' : 'disabled'}>Използвай жокер (−1 т.)</button></div>`}</div>`}
      <div class="card"><h4>Бит обяснява</h4><div class="bit-says">${bitFace()}<div><p><b>${esc(CARDS.assign.t)}</b></p><p>${CARDS.assign.b}</p></div></div></div>
    </aside></section>`;
}
function swapCmd(lr) {
  const sw = S.swap, l = lr[0], r = lr[1];
  if (sw.done || sw.lost) return;
  if (sw.mem[r] === null) { toast(`Чаша ${r} е празна – няма какво да прелеем.`); return; }
  sw.mem[l] = sw.mem[r];
  sw.log.push(`${l} = ${r}`);
  const vals = Object.values(sw.mem);
  if (!vals.includes(7) || !vals.includes(2)) {
    const lostV = !vals.includes(7) ? 7 : 2;
    sw.lost = `Ох! Стойността ${lostV} е изгубена завинаги – вече я няма в нито една чаша. Затова ни трябва третата чаша c.`;
    sw.fails++;
  } else if (sw.mem.a === 2 && sw.mem.b === 7) {
    sw.done = true; sw.pts = Math.max(1, 4 - sw.fails); sw.firstTry = sw.fails === 0 && sw.log.length === 3;
    toast('Паметта на Бит е поправена!');
  }
  save(); render();
  const g = document.getElementById('g-' + l); if (g) { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }
}

/* ---------- break it ---------- */
function renderBreak() {
  const b = S.brk;
  const price = parse(b.price), count = parse(b.count);
  const ok = !Number.isNaN(price) && !Number.isNaN(count);
  const sum = ok ? price * count : NaN, rest = ok ? 20 - sum : NaN;
  view.innerHTML = `<section class="mod">
    <div class="card mod-main"><div class="mod-head"><span class="no">Финал</span><h2>Счупи го!</h2>
      <p class="story">Касовият апарат на Бит е поправен и смята правилно: сума = цена * брой, ресто = 20 − сума. Но дали е умен?</p>
      <p class="task">Намерете цена и брой, при които Бит дава абсурден отговор.</p></div>
      <div class="brk" style="margin-top:14px">
        <div>
          <div class="inputs">
            <div class="field"><label for="bPrice">цена (€)</label><input id="bPrice" type="text" inputmode="decimal" value="${esc(b.price)}"></div>
            <div class="field"><label for="bCount">брой</label><input id="bCount" type="text" inputmode="decimal" value="${esc(b.count)}"></div>
          </div>
          <div class="prog" style="margin:14px 0 0;max-width:none;align-items:flex-start">
            <div class="blk term">Начало</div><div class="arrow" style="margin:0 0 0 64px"></div>
            <div class="blk in">въведи цена, брой</div><div class="arrow" style="margin:0 0 0 64px"></div>
            <div class="blk calc">сума = цена * брой</div><div class="arrow" style="margin:0 0 0 64px"></div>
            <div class="blk calc">ресто = 20 - сума</div><div class="arrow" style="margin:0 0 0 64px"></div>
            <div class="blk out">изведи сума, ресто</div><div class="arrow" style="margin:0 0 0 64px"></div>
            <div class="blk term">Край</div>
          </div>
        </div>
        <div>
          <div class="receipt" id="receipt">${receiptHtml(price, count, sum, rest, ok)}</div>
          <div id="brkMsg">${b.done ? brkDoneHtml() : ''}</div>
        </div>
      </div>
    </div>
    <aside class="side"><div class="card"><h4>Бит обяснява</h4><div class="bit-says">${bitFace()}<div><p><b>${esc(CARDS.lin.t)}</b></p><p>${CARDS.lin.b}</p></div></div></div></aside>
  </section>`;
}
function receiptHtml(price, count, sum, rest, ok) {
  if (!ok) return '<p style="margin:0;color:var(--muted)">Въведете числа.</p>';
  return `<div><span>Касова бележка</span><span>Бит</span></div>
    <div><span>${fmt(count)} × ${fmt(price)} €</span><span>${fmt(sum)} €</span></div>
    <div><span>Платено</span><span>20 €</span></div>
    <div class="tot ${rest < 0 ? 'neg' : ''}"><span>Ресто</span><span>${fmt(rest)} €</span></div>`;
}
function brkDoneHtml() {
  return `<div class="msg good">Счупихте го! +${S.brk.pts} т.</div>
    <div class="msg info"><b>Защо?</b> Линейният алгоритъм изпълнява всяка стъпка точно веднъж и не може да провери дали парите стигат. Бит трябва да попита: „сума > 20?“ – и при „да“ да откаже продажбата. Въпрос с отговор да/не е <b>ромб</b> – това е темата на следващия час.</div>
    <div class="row"><button class="btn primary" type="button" data-go="report">Към отчета</button></div>`;
}
function onBreakInput() {
  const b = S.brk;
  b.price = $('#bPrice').value; b.count = $('#bCount').value;
  const price = parse(b.price), count = parse(b.count);
  const ok = !Number.isNaN(price) && !Number.isNaN(count);
  const sum = ok ? price * count : NaN, rest = ok ? 20 - sum : NaN;
  $('#receipt').innerHTML = receiptHtml(price, count, sum, rest, ok);
  if (ok && !b.done && (rest < 0 || count < 0 || price < 0 || (count % 1 !== 0))) {
    b.done = true; b.pts = 2;
    b.how = rest < 0 ? 'отрицателно ресто' : count < 0 ? 'отрицателен брой' : price < 0 ? 'отрицателна цена' : 'дробен брой тетрадки';
    toast('Абсурд! Бит не може да откаже.');
    $('#brkMsg').innerHTML = brkDoneHtml();
    renderBar();
  }
  save();
}

/* ---------- report ---------- */
function badges() {
  const doneMods = Object.entries(S.mods).filter(([, m]) => m.stage === 'done');
  const ordered = Object.values(S.mods).filter(m => m.stage !== 'order');
  return [
    { n: 'Трасировач', d: 'Всички таблици верни от първия път (мин. 3 модула)', got: doneMods.length >= 3 && doneMods.every(([, m]) => m.traceFirst) },
    { n: 'Без капан', d: 'Не сте паднали в нито един капан (мин. 3 модула)', got: ordered.length >= 3 && !Object.values(S.mods).some(m => m.trapHit) },
    { n: 'Майстор на размяната', d: 'Паметта – от първия път, с 3 команди', got: !!S.swap.firstTry },
    { n: 'Без жокери', d: 'Без нито една подсказка (мин. 4 модула)', got: S.hintsUsed === 0 && repairedMain() >= 4 },
    { n: 'Разбивач', d: 'Счупихте касовия апарат', got: S.brk.done }
  ];
}
function renderReport() {
  const rows = [...MODS.map(m => [m.name + (m.bonus ? ' (бонус)' : ''), isDone(m.id) ? S.mods[m.id].ptsOrder + S.mods[m.id].ptsTrace : null]),
    ['Памет', S.swap.done ? S.swap.pts : null], ['Счупи го!', S.brk.done ? S.brk.pts : null]];
  const mins = Math.round((Date.now() - S.started) / 60000);
  view.innerHTML = `<section class="card report">
    <span class="pill done">Отчет за учителя</span>
    <h2>${esc(S.team)}</h2>
    <div class="score">${score()}</div><p style="margin:4px 0 0;color:var(--muted)">точки · поправени модули: ${repairedMain()} от 6 · жокери: ${S.hintsUsed} · ${mins} мин.</p>
    <div class="badges">${badges().map(b => `<div class="badge ${b.got ? 'got' : 'no'}"><b>${b.got ? '✓ ' : ''}${esc(b.n)}</b><span>${esc(b.d)}</span></div>`).join('')}</div>
    <table class="rep-table"><tbody>${rows.map(([n, p]) => `<tr><td>${esc(n)}</td><td>${p === null ? '—' : '+' + p}</td></tr>`).join('')}${S.hintsUsed ? `<tr><td>Жокери</td><td>−${S.hintsUsed}</td></tr>` : ''}</tbody></table>
    <p style="color:var(--muted)">Покажете този екран на учителя.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" type="button" data-go="map">Към картата</button><button class="btn danger" type="button" data-act="toStart">Нова игра</button></div>
  </section>`;
}

/* ---------- events ---------- */
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  const act = b.dataset.act;
  if (act === 'begin') {
    const n = ($('#teamName').value || '').trim();
    if (!n) { toast('Въведете име на екипа.'); $('#teamName').focus(); return; }
    S = fresh(n); save(); go('map'); return;
  }
  if (act === 'continue') { S = load(); if (S.view === 'start') S.view = 'map'; render(); return; }
  if (act === 'askNew') { $('#newConfirm').hidden = false; return; }
  if (act === 'confirmNew') { try { localStorage.removeItem(KEY); } catch (_) {} S = null; renderStart(); return; }
  if (act === 'toStart') { S.view = 'start'; save(); render(); return; }
  if (act === 'hint') return useHint();
  if (act === 'swapReset') { S.swap.mem = { a: 7, b: 2, c: null }; S.swap.log = []; S.swap.lost = null; save(); render(); return; }
  if (b.dataset.cmd) return swapCmd(b.dataset.cmd);
  if (S && S.view.startsWith('mod:')) {
    const m = modById(S.view.slice(4)), ms = mstate(m.id);
    if (b.dataset.add) { ms.chain.push(b.dataset.add); ms.msg = null; ms.badIds = []; }
    else if (b.dataset.remove) { ms.chain = ms.chain.filter(x => x !== b.dataset.remove); ms.msg = null; ms.badIds = []; }
    else if (b.dataset.up !== undefined) { const i = +b.dataset.up; [ms.chain[i - 1], ms.chain[i]] = [ms.chain[i], ms.chain[i - 1]]; ms.msg = null; }
    else if (b.dataset.down !== undefined) { const i = +b.dataset.down; [ms.chain[i + 1], ms.chain[i]] = [ms.chain[i], ms.chain[i + 1]]; ms.msg = null; }
    else if (act === 'checkOrder') checkOrder(m, ms);
    else if (act === 'checkTrace') { readTrace(ms); checkTrace(m, ms); }
    else return;
    save(); render();
  }
});
function readTrace(ms) { view.querySelectorAll('[data-tr]').forEach(i => { ms.trace[i.dataset.tr] = i.value; }); }
view.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.tr && S.view.startsWith('mod:')) {
    const ms = mstate(S.view.slice(4)); ms.trace[e.target.dataset.tr] = e.target.value; e.target.classList.remove('bad', 'ok'); save();
  }
  if (e.target.id === 'bPrice' || e.target.id === 'bCount') onBreakInput();
});
view.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'teamName') { e.preventDefault(); view.querySelector('[data-act=begin]').click(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.tr) { e.preventDefault(); view.querySelector('[data-act=checkTrace]').click(); }
});
function useHint() {
  if (!S.hintsLeft) return;
  let key, text;
  if (S.view === 'swap') { key = 'swap'; text = 'Преди да презапишете a, запазете старата му стойност в празната чаша c. Три команди стигат.'; }
  else {
    const m = modById(S.view.slice(4)), ms = mstate(m.id);
    key = m.id + ':' + ms.stage;
    if (ms.stage === 'trace') readTrace(ms);
    text = ms.stage === 'order' ? m.hintOrder : traceHint(m, ms);
  }
  if (S.hints[key]) return;
  S.hintsLeft--; S.hintsUsed++; S.hints[key] = text;
  save(); render();
}

/* ---------- boot ---------- */
const saved = load();
if (saved && saved.team && saved.view !== 'start') { S = saved; } else { S = null; }
render();
})();
</script>
</body>
</html>
